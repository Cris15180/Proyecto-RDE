<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js</title>
    <link rel="stylesheet" href="../css/asistencia.css">
</head>

    <header class="topbar">
        <a class="brand" href="index.html"><span class="brand-mark">R</span><span>RDE</span></a>
        <nav class="nav" aria-label="Navegación principal">
            <a class="nav-link" href="src/asistencia.html">Asistencia</a>
            <a class="nav-link" href="src/comunicacion.html">Comunicación</a>
            <a class="nav-link" href="src/calendario.html">Calendario</a>
        </nav>
        <a class="profile-link" href="src/perfil.html" aria-label="Ir al perfil">
            <span class="profile-icon" aria-hidden="true">♙</span><span class="profile-label">Mi perfil</span>
        </a>
    </header>
        
<body>

    <main class="container">



        <section class="buscador">
            
            <label for="searchInput">Ingrese correo electronico del encargado:</label>
            <input type="mail" id="searchInput" placeholder="Correo electronico">
        </section>

                <section class="buscador">
            
            <label for="searchInput">Ingrese el nombre del estudiante:</label>
            <input type="text" id="searchInput" placeholder="Nombre de estudiante">
        </section>



        <section class="controls">

            <label for="sectionSelect">
                Seleccionar sección:
            </label>

            <select id="sectionSelect">
                <option value="seccion1">11-4</option>
                <option value="seccion2">11-3</option>
                <option value="seccion3">11-2</option>
                <option value="seccion4">11-1</option>
            </select>

        </section>

        <section class="attendance-section">

            <h2 id="sectionTitle">Sección 1</h2>

            <div id="studentsList" class="students-list">
                <!-- Los estudiantes aparecerán aquí -->
            </div>

        </section>

        <section class="chart-section">

            <h2>Asistencia por sección</h2>

            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>

        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/asistencia.js"></script>

</body>
</html>
